<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>8trackVinyl</title>
  <link rel="stylesheet" href="css/style.css">

  <!-- Swiper CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper/swiper-bundle.min.css">
</head>

<body>

<header>
  <h1 style="text-align:center;">8trackVinyl</h1>
</header>

<main>

  <h2 id="now-playing">Click Start</h2>

  <button id="start-btn" disabled>Loading videos...</button>

  <!-- Clean buttons (no onclick) -->
  <button id="play-original">Test Original</button>
  <button id="play-cover">Test Cover</button>

  <button id="vote-original">Vote Original</button>
  <button id="vote-cover">Vote Cover</button>

  <!-- YouTube Players -->
  <div id="ytOriginal"></div>
  <div id="ytCover"></div>

  <!-- Carousel -->
  <div class="swiper">
    <div class="swiper-wrapper">

      <div class="swiper-slide"><img src="img/aleksey.jpg"></div>
      <div class="swiper-slide"><img src="img/mert.jpg"></div>
      <div class="swiper-slide"><img src="img/tuyen.jpg"></div>
      <div class="swiper-slide"><img src="img/RayCharles.jpg"></div>
      <div class="swiper-slide"><img src="img/andrey.jpg"></div>
      <div class="swiper-slide"><img src="img/jon.jpg"></div>
      <div class="swiper-slide"><img src="img/mack.jpg"></div>
      <div class="swiper-slide"><img src="img/Ray&Al.webp"></div>
      <div class="swiper-slide"><img src="img/tara.jpg"></div>
      <div class="swiper-slide"><img src="img/Beatles.jpg"></div>
      <div class="swiper-slide"><img src="img/Elton.jpg"></div>

    </div>

    <div class="swiper-button-next"></div>
    <div class="swiper-button-prev"></div>
    <div class="swiper-pagination"></div>
  </div>

  <!-- Battles -->
  <section class="battle" data-battle="0">
    <div class="song original">
      <img class="original-img" src="img/theorioles.jpg">
      <h3>Original</h3>
    </div>
    <div class="song cover">
      <img class="cover-img" src="img/EllaF.webp">
      <h3>Cover</h3>
    </div>
  </section>

  <section class="battle" data-battle="1">
    <div class="song original">
      <img class="original-img" src="img/Ray&Al.webp">
      <h3>Original</h3>
    </div>
    <div class="song cover">
      <img class="cover-img" src="img/NatK.jpg">
      <h3>Cover</h3>
    </div>
  </section>

  <section class="battle" data-battle="2">
    <div class="song original">
      <img class="original-img" src="img/Judy.webp">
      <h3>Original</h3>
    </div>
  
    <div class="song cover">
      <img class="cover-img" src="img/RayCharles.jpg">
      <h3>Cover</h3>
    </div>
  </section>

</main>

<!-- Swiper JS -->
<script src="https://cdn.jsdelivr.net/npm/swiper/swiper-bundle.min.js"></script>

<script>
new Swiper('.swiper', {
  loop: true,
  centeredSlides: true,
  slidesPerView: 3,
  autoplay: { delay: 3000 },
  effect: 'coverflow',
  coverflowEffect: {
    rotate: 60,
    depth: 200
  },
  navigation: {
    nextEl: '.swiper-button-next',
    prevEl: '.swiper-button-prev'
  },
  pagination: {
    el: '.swiper-pagination',
    clickable: true
  }
});
</script>




<!-- Your JS -->

<script src="js/app.js"></script>

</body>
</html>
